<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Krazy Mike’s door scanner for phones, v1.0 (Oct 2026).
A stand-alone page for door staff: PIN, camera, scan. It is the Door Entry screen of the venue admin (admin v1.8) on its own, so it
can live at a public https address (a phone camera only works on https) without putting the manager dashboard, the Box Office or any
login on that address. It talks to one thing only: POST /api/validate-ticket (the same endpoint the admin uses). No database
connection and no keys are in this file.
v1.0: shows are not locked by default (a ticket for any show is admitted, as in the admin). To lock a link to one show, add ?event=EVENT_ID
to the address; tickets for any other show are then refused ("Wrong event").
v1.0: the screen stays awake while the scanner is open (phones otherwise dim and lock in the middle of a line).
v1.0: DOOR_PIN below is the one setting to change before handing the link out. It sits in the page source, so it keeps casual visitors out of
the scanner screen; it is not a security boundary (a scan still needs a real ticket and a live code).
Tables: each scan admits part of a party ("Admit 1 · 2 of 4 admitted"); the people-entering control admits several with one scan; an amber
"Wait for a new code" means that QR just admitted someone (needs api/validate-ticket.js v3). -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#15181d">
<title>Krazy Mike’s – Door Entry</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#15181d; --bg2:#1b1e25; --bg3:#23262e; --bg4:#2a2e38;
    --border:#343a47; --border2:#4d5568;
    --txt:#e8eaf0; --txt2:#a8adb8; --txt3:#9298a8;
    --gold:#c9a84c; --goldl:rgba(201,168,76,0.12); --goldb:rgba(201,168,76,0.25);
    --ok:#1d9e75; --okl:rgba(29,158,117,0.12); --okd:#22c97a;
    --red:#c0392b; --redl:rgba(192,57,43,0.12); --redd:#e07070;
    --fm:ui-monospace,'IBM Plex Mono',Menlo,Consolas,monospace; --fs:system-ui,-apple-system,'Segoe UI','IBM Plex Sans',Roboto,sans-serif;
    --radius:4px;
  }
  html,body { min-height:100%; background:var(--bg); color:var(--txt); font-family:var(--fs); -webkit-text-size-adjust:100%; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:.4rem; padding:10px 18px; border-radius:var(--radius); font-family:var(--fs); font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent; }
  .btn-ghost { background:transparent; color:var(--txt2); border-color:var(--border2); }
  .btn-ghost:hover { background:var(--bg3); color:var(--txt); }
  .btn-sm { padding:6px 12px; font-size:11px; }
  .btn-panel-door { width:100%; padding:14px; border-radius:var(--radius); background:var(--gold); color:#0d0f12; border:1px solid var(--gold); font-family:var(--fm); font-size:12px; letter-spacing:1px; text-transform:uppercase; font-weight:700; cursor:pointer; }
  .form-label { display:block; font-family:var(--fm); font-size:10px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:var(--txt3); margin-bottom:.5rem; }
  .form-input { width:100%; background:var(--bg4); border:1px solid var(--border2); border-radius:var(--radius); padding:12px 14px; font-family:var(--fm); font-size:16px; color:var(--txt); outline:none; }
  .form-input:focus { border-color:var(--gold); }
  .err-msg { background:var(--redl); border:1px solid rgba(192,57,43,0.3); border-radius:var(--radius); padding:.65rem .85rem; font-size:12px; color:var(--redd); margin-bottom:1rem; font-family:var(--fm); }
  .info-note { background:var(--goldl); border:1px solid var(--goldb); border-radius:var(--radius); padding:.55rem .8rem; font-size:12px; color:var(--gold); margin-bottom:.75rem; font-family:var(--fm); text-align:center; }

  #pin-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
  .pin-card { width:100%; max-width:360px; background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:1.75rem 1.5rem; text-align:center; }
  .pin-title { font-size:22px; font-weight:700; margin:.25rem 0 .2rem; }
  .pin-sub { font-family:var(--fm); font-size:11px; color:var(--txt3); letter-spacing:1px; margin-bottom:1.25rem; }
  .pin-card .form-input { text-align:center; letter-spacing:4px; margin-bottom:1rem; }

  .topbar { display:flex; justify-content:space-between; align-items:center; padding:.85rem 1.5rem; background:var(--bg2); border-bottom:1px solid var(--border); }
  .topbar-left, .topbar-right { display:flex; align-items:center; gap:.85rem; }
  .topbar-logo { font-weight:700; font-size:14px; }
  .topbar-divider { width:1px; height:18px; background:var(--border2); }
  .topbar-title { font-family:var(--fm); font-size:11px; color:var(--txt3); letter-spacing:1px; text-transform:uppercase; }
  .version-pill { font-family:var(--fm); font-size:10px; font-weight:700; letter-spacing:.5px; color:var(--gold); background:var(--goldl); border:1px solid var(--goldb); border-radius:10px; padding:3px 9px; white-space:nowrap; }

  #door-screen { min-height:100vh; padding:1.5rem; padding-bottom:calc(1.5rem + env(safe-area-inset-bottom, 0px)); max-width:480px; margin:0 auto; }
  .scan-result { background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:2rem 1rem; text-align:center; margin:1rem 0; min-height:180px; display:flex; align-items:center; justify-content:center; }
  .scan-valid { background:#0a1f14; border-color:rgba(34,201,122,0.4); }
  .scan-invalid { background:#1f0a0a; border-color:rgba(224,85,85,0.4); }
  .scan-wait { background:#1a1500; border-color:rgba(201,168,76,0.5); }
  .door-bar { height:10px; border-radius:6px; background:rgba(255,255,255,.12); margin:10px auto 0; max-width:280px; overflow:hidden; }
  .door-bar i { display:block; height:100%; background:var(--okd,#22c97a); }
  .door-admit { display:flex; align-items:center; justify-content:center; gap:.6rem; flex-wrap:wrap; margin:0 0 .75rem; font-size:12px; color:var(--txt2); }
  .door-admit .btn { min-width:48px; height:44px; font-size:20px; padding:0 14px; }
  #door-admit-n { min-width:2ch; text-align:center; font-size:26px; font-weight:800; color:var(--txt); }
  #scan-video { width:100%; border-radius:8px; background:#000; }

<body>

<div id="pin-screen">
  <div class="pin-card">
    <span class="km-mark km-mark-lg" role="img" aria-label="Krazy Mike’s logo"></span>
    <div class="pin-title">Door Entry</div>
    <div class="pin-sub">KRAZY MIKE’S · STAFF ONLY</div>
    <div id="pin-err" class="err-msg" style="display:none"></div>
    <label class="form-label" for="door-pin">Door Entry PIN</label>
    <input class="form-input" type="password" id="door-pin" placeholder="••••••••" maxlength="8" autocomplete="off" inputmode="text" onkeydown="if(event.key==='Enter')checkDoorPin()">
    <button class="btn-panel-door" onclick="checkDoorPin()">Open Scanner →</button>
  </div>
</div>

<div id="door-screen" style="display:none">
  <div class="topbar" style="margin:-1.5rem -1.5rem 1.5rem -1.5rem">
    <div class="topbar-left">
      <div class="topbar-logo"><span class="km-mark" role="img" aria-label="Krazy Mike’s logo"></span>Krazy Mike’s</div>
      <div class="topbar-divider"></div>
      <div class="topbar-title">Door Entry</div>
    </div>
    <div class="topbar-right" style="display:flex;align-items:center;gap:10px">
      <span class="version-pill">krazymikes_door v1.0</span>
      <button class="btn btn-ghost btn-sm" onclick="exitDoorScreen()">Exit</button>
    </div>
  </div>
  <div id="lock-note" class="info-note" style="display:none"></div>
  <video id="scan-video" autoplay muted playsinline></video>
  <div class="scan-result" id="scan-result"><div id="scan-inner">Point camera at QR code</div></div>
  <div class="door-admit"><span>People entering with this scan (tables)</span><button type="button" class="btn btn-ghost" onclick="doorAdmitStep(-1)" aria-label="Fewer people">-</button><span id="door-admit-n" aria-live="polite">1</span><button type="button" class="btn btn-ghost" onclick="doorAdmitStep(1)" aria-label="More people">+</button></div>
  <div style="text-align:center;font-family:var(--fm);font-size:12px;color:var(--txt3);margin-bottom:.5rem">Admitted today: <span id="scan-count">0</span></div>
  <div id="scan-log"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
const VERCEL_API = 'https://octickets-api.vercel.app';

// ── THE ONE SETTING TO CHANGE ───────────────────────────────────────────────
// Door staff type this to open the scanner. It is visible in the page source, so it keeps casual visitors
// out; it is not a security boundary. 8 characters at most (the field's own limit).
const DOOR_PIN = '112233';

// Optional: lock this link to one show by adding ?event=EVENT_ID to the address. Empty means any show.
const LOCK_EVENT = (new URLSearchParams(location.search).get('event') || '').trim() || null;

function kmEsc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

let scanCount = 0;
let scanStream = null, scanAnimFrame = null;

// ── PIN ─────────────────────────────────────────────────────────────────────
// A correct PIN is remembered for this browser tab only, so a reload does not lock staff out mid-shift.
const PIN_OK_KEY = 'km_door_ok';
function openDoorScreen() {
  document.getElementById('pin-screen').style.display = 'none';
  document.getElementById('door-screen').style.display = 'block';
  const note = document.getElementById('lock-note');
  if (LOCK_EVENT) { note.textContent = 'Locked to one show (' + LOCK_EVENT + '). Tickets for other shows are refused.'; note.style.display = 'block'; }
  keepAwake();
  startCameraScanner();
}
function checkDoorPin() {
  const val = document.getElementById('door-pin').value;
  const errEl = document.getElementById('pin-err');
  if (val === DOOR_PIN) {
    try { sessionStorage.setItem(PIN_OK_KEY, DOOR_PIN); } catch (e) { /* private mode: they just type it again after a reload */ }
    document.getElementById('door-pin').value = '';
    errEl.style.display = 'none';
    openDoorScreen();
  } else {
    errEl.textContent = 'Incorrect PIN.';
    errEl.style.display = 'block';
  }
}
function exitDoorScreen() {
  stopCameraScanner();
  releaseAwake();
  try { sessionStorage.removeItem(PIN_OK_KEY); } catch (e) { }
  document.getElementById('door-screen').style.display = 'none';
  document.getElementById('pin-screen').style.display = 'flex';
}

// ── Keep the phone screen on while scanning ─────────────────────────────────
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* not supported or refused: the phone may dim, nothing breaks */ }
}
function releaseAwake() { try { if (wakeLock) wakeLock.release(); } catch (e) { } wakeLock = null; }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && document.getElementById('door-screen').style.display === 'block') { keepAwake(); }
});

// ── DOOR SCANNER (camera) — copied from the venue admin ─────────────────────
async function startCameraScanner(){
  const video = document.getElementById('scan-video');
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = scanStream;
    scanAnimFrame = requestAnimationFrame(scanFrameLoop);
  } catch(e){
    document.getElementById('scan-inner').textContent = 'Camera error: ' + e.message;
  }
}
function stopCameraScanner(){
  if(scanStream){ scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  if(scanAnimFrame) cancelAnimationFrame(scanAnimFrame);
}

function scanFrameLoop(){
  const video = document.getElementById('scan-video');
  if(video.readyState === video.HAVE_ENOUGH_DATA){
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    if(window.jsQR){
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if(code?.data){ handleScannedQR(code.data); return; }
    }
  }
  scanAnimFrame = requestAnimationFrame(scanFrameLoop);
}

async function handleScannedQR(payload){
  if(!payload) return;
  stopCameraScanner();
  const resultEl = document.getElementById('scan-result');
  const innerEl = document.getElementById('scan-inner');
  innerEl.innerHTML = '<div>⏳ Validating…</div>';
  try {
    const resp = await fetch(VERCEL_API + '/api/validate-ticket', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token: payload, eventId: LOCK_EVENT, admitCount: doorAdmitN }),   // admitCount only matters for a table with a party; the server ignores it for everything else
    });
    const data = await resp.json();
    doorAdmitReset();   // the number entering applies to one scan only, so the next table starts at 1
    const isTable = Number(data.partySize) > 1;   // set by the server for a table with a party
    if(data.valid){
      scanCount += Number(data.admittedNow) || 1; document.getElementById('scan-count').textContent = scanCount;
      resultEl.className = 'scan-result scan-valid';
      if(isTable){
        const name = String((data.ticket && (data.ticket.seatFull || data.ticket.seat)) || 'Table').replace(/\s*\(admits \d+\)/i, '');
        const pct = Math.round(100 * data.admitted / data.partySize);
        innerEl.innerHTML = `<div style="width:100%"><div style="font-size:48px">✅</div><div style="font-size:24px;font-weight:900;color:var(--okd)">VALID</div><div>${kmEsc(name)}</div>`
          + `<div style="font-size:32px;font-weight:900;margin-top:6px">Admit ${data.admittedNow}</div>`
          + `<div style="font-size:14px;margin-top:6px">${data.complete ? `Table complete: all ${data.partySize} admitted` : `${data.admitted} of ${data.partySize} admitted &middot; ${data.remaining} still to come`}</div>`
          + `<div class="door-bar"><i style="width:${pct}%"></i></div></div>`;
      } else {
        innerEl.innerHTML = `<div><div style="font-size:48px">✅</div><div style="font-size:24px;font-weight:900;color:var(--okd)">VALID</div><div>${data.ticket?.seat||'Reserved Seat'}</div>${(() => { const a = /admits (\d+)/i.exec((data.ticket && data.ticket.seat) || ''); return a ? `<div style="font-size:22px;font-weight:800;margin-top:6px">Admit ${a[1]}</div>` : ''; })()}</div>`;
      }
    } else if(data.ticket_status === 'transfer_pending'){
      resultEl.className = 'scan-result scan-invalid';
      innerEl.innerHTML = `<div><div style="font-size:48px">⛔</div><div style="font-size:20px;font-weight:900;color:var(--gold)">TRANSFER HOLD</div><div>Entry not permitted</div></div>`;
    } else if(isTable && /already used for an admission/i.test(data.reason || '')){
      // Not a bad ticket: this QR code just admitted someone, and one code can only admit once. A new code appears within 30 seconds.
      resultEl.className = 'scan-result scan-wait';
      innerEl.innerHTML = `<div><div style="font-size:48px">⏳</div><div style="font-size:22px;font-weight:900;color:var(--gold)">WAIT FOR A NEW CODE</div>`
        + `<div style="margin-top:6px">${data.admitted} of ${data.partySize} admitted so far</div>`
        + `<div style="font-size:13px;margin-top:8px;max-width:300px">That code was just used. Ask the guest to wait a few seconds for the QR to refresh, then scan again. To let several in with one scan, set how many are entering first.</div></div>`;
    } else {
      resultEl.className = 'scan-result scan-invalid';
      innerEl.innerHTML = `<div><div style="font-size:48px">❌</div><div style="font-size:24px;font-weight:900;color:var(--redd)">INVALID</div><div>${data.reason||'Invalid ticket'}</div></div>`;
    }
    setTimeout(() => { resultEl.className = 'scan-result'; innerEl.textContent = 'Point camera at QR code'; startCameraScanner(); }, 3000);
  } catch(e){
    innerEl.innerHTML = `<div>⚠️ Network error: ${e.message}</div>`;
    setTimeout(() => startCameraScanner(), 3000);
  }
}
// How many people are entering with the next scan (tables only). Goes back to 1 after every scan.
let doorAdmitN = 1;
function doorAdmitSet(n){
  doorAdmitN = Math.max(1, Math.min(8, Math.round(Number(n)) || 1));
  const el = document.getElementById('door-admit-n'); if(el) el.textContent = doorAdmitN;
}
function doorAdmitStep(d){ doorAdmitSet(doorAdmitN + d); }
function doorAdmitReset(){ doorAdmitSet(1); }

// A phone camera only works on a secure (https) address.
if (!window.isSecureContext) {
  document.getElementById('pin-err').textContent = 'This page must be opened from an https address for the camera to work.';
  document.getElementById('pin-err').style.display = 'block';
}
// Reload mid-shift: skip the PIN if it was already entered in this tab.
try { if (sessionStorage.getItem(PIN_OK_KEY) === DOOR_PIN) openDoorScreen(); } catch (e) { }
</script>
